name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # TS-6: committed auditctl shards are authoritative evidence until the S4
  # evidence-home import and must not be rewritten. Fetches the checker from
  # agentops (public), pinned to a specific commit. PR-only: it diffs against
  # the PR base, which a push-to-main event does not supply.
  append-only-shards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout agentops at a pinned commit
        uses: actions/checkout@v5
        with:
          repository: bayleafwalker/agentops
          ref: 775e9c0fc35aa4d6d29f3a087a8b913acc09ffac
          path: agentops-contracts

      - name: check
        run: |
          python3 agentops-contracts/scripts/check_append_only_shards.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run pytest
